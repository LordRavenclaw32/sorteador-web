<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador Web</title>
    <style>
        :root { --bg: #f4f6f9; --card: #ffffff; --primary: #3498db; --success: #2ecc71; --danger: #e74c3c; --text: #2c3e50; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .container { flex: 1; max-width: 600px; margin: 20px auto; width: 90%; background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        h1 { margin-top: 0; color: var(--text); }
        
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; background: var(--primary); transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .btn-success { background: var(--success); font-size: 1.2rem; }
        .btn-danger { background: var(--danger); }
        
        .hidden { display: none !important; }
        
        /* Admin Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: #ecf0f1; color: var(--text); padding: 10px; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { text-align: left; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 20px; min-height: 200px; max-height: 400px; overflow-y: auto; }
        
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 10px; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; font-size: 0.95em; }
        .item-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; margin-left: 10px; }
        
        /* Modal Vencedor */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .modal-card { background: white; padding: 30px; border-radius: 16px; text-align: center; width: 90%; max-width: 400px; animation: pop 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        .modal-card h2 { color: var(--danger); font-size: 2.2rem; margin: 0 0 10px 0; }
        .modal-card h3 { font-size: 1.8rem; margin: 0; }
        .modal-card p { font-size: 1.2rem; color: #555; }
        .modal-img { max-width: 100%; max-height: 250px; border-radius: 8px; margin: 15px 0; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        footer { text-align: center; padding: 15px; font-size: 0.85em; color: #7f8c8d; background: #e9ecef; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sorteador Web</h1>

        <!-- Visão Participante -->
        <div id="view-participant">
            <input type="text" id="part-name" placeholder="O seu nome completo" autocomplete="off">
            <button onclick="window.join()">Ingressar no Sorteio</button>
        </div>
        
        <div id="view-waiting" class="hidden" style="background: #e8f8f5; padding: 20px; border-radius: 8px; color: #117a65;">
            <h3>✅ Registado com sucesso!</h3>
            <p>Aguarde o sorteio neste ecrã.</p>
        </div>

        <!-- Visão Admin -->
        <div id="view-admin" class="hidden">
            <div class="tabs">
                <button id="tab-btn-brindes" class="tab-btn active" onclick="window.switchTab('brindes')">🎁 Brindes (<span id="c-brindes">0</span>)</button>
                <button id="tab-btn-parts" class="tab-btn" onclick="window.switchTab('parts')">👥 Participantes (<span id="c-parts">0</span>)</button>
            </div>

            <div id="tab-brindes" class="tab-content">
                <input type="text" id="prize-name" placeholder="Nome do Brinde">
                <input type="url" id="prize-img" placeholder="URL da Imagem (Opcional)">
                <button onclick="window.addPrize()" style="margin-bottom: 20px;">+ Adicionar Brinde</button>
                <ul id="list-brindes"></ul>
            </div>

            <div id="tab-parts" class="tab-content hidden">
                <ul id="list-parts"></ul>
            </div>

            <button class="btn-success" onclick="window.draw()">🎲 SORTEAR AGORA</button>
            <button class="btn-danger" onclick="window.reset()" style="margin-top: 15px; font-size: 0.9em; padding: 10px;">Limpar Dados (Reset)</button>
        </div>
    </div>

    <!-- Modal Vencedor -->
    <div id="modal-winner" class="modal-overlay hidden">
        <div class="modal-card">
            <h2>🏆 VENCEDOR!</h2>
            <h3 id="w-name"></h3>
            <p>Ganhou: <b id="w-prize"></b></p>
            <img id="w-img" src="" alt="Brinde" class="modal-img hidden">
            <button onclick="window.closeModal()" style="background: #333; margin-top: 20px;">Fechar</button>
        </div>
    </div>

    <footer>A.R.S. HTML GAMES e APPS</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove, get } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCUDmi1KJXKSUsK1tlRuEHhumrP5WObBQI",
            authDomain: "sorteador-a931a.firebaseapp.com",
            projectId: "sorteador-a931a",
            storageBucket: "sorteador-a931a.firebasestorage.app",
            messagingSenderId: "1049573723433",
            appId: "1:1049573723433:web:815b84b1e957f5bb9e7b38"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const rParts = ref(db, 'parts');
        const rPrizes = ref(db, 'prizes');
        const rDraw = ref(db, 'draw');

        const isAdmin = new URLSearchParams(window.location.search).has('admin');

        // Configuração Inicial de Visualização
        if (isAdmin) {
            document.getElementById('view-participant').classList.add('hidden');
            document.getElementById('view-admin').classList.remove('hidden');
        } else if (localStorage.getItem('sort_name')) {
            document.getElementById('view-participant').classList.add('hidden');
            document.getElementById('view-waiting').classList.remove('hidden');
        }

        // --- FUNÇÕES GLOBAIS ---
        window.switchTab = function(tab) {
            document.getElementById('tab-brindes').classList.add('hidden');
            document.getElementById('tab-parts').classList.add('hidden');
            document.getElementById('tab-btn-brindes').classList.remove('active');
            document.getElementById('tab-btn-parts').classList.remove('active');
            
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-btn-${tab}`).classList.add('active');
        };

        window.join = async function() {
            const name = document.getElementById('part-name').value.trim();
            if (!name) return alert("Insira o seu nome.");
            
            await push(rParts, { name });
            localStorage.setItem('sort_name', name);
            document.getElementById('view-participant').classList.add('hidden');
            document.getElementById('view-waiting').classList.remove('hidden');
        };

        window.addPrize = async function() {
            const name = document.getElementById('prize-name').value.trim();
            const img = document.getElementById('prize-img').value.trim();
            if (!name) return alert("O brinde precisa de um nome.");
            
            await push(rPrizes, { name, img });
            document.getElementById('prize-name').value = '';
            document.getElementById('prize-img').value = '';
        };

        window.draw = async function() {
            const sParts = await get(rParts);
            const sPrizes = await get(rPrizes);
            
            const parts = [];
            if (sParts.exists()) sParts.forEach(c => parts.push({ id: c.key, ...c.val() }));
            
            const prizes = [];
            if (sPrizes.exists()) sPrizes.forEach(c => prizes.push({ id: c.key, ...c.val() }));

            if (!prizes.length) return alert("Não há brindes.");
            if (!parts.length) return alert("Não há participantes.");

            const prize = prizes[0];
            const winner = parts[Math.floor(Math.random() * parts.length)];

            // Remove vencedor e brinde sorteado
            await remove(ref(db, `prizes/${prize.id}`));
            await remove(ref(db, `parts/${winner.id}`));

            // Dispara modal para todos
            await set(rDraw, {
                wName: winner.name,
                pName: prize.name,
                img: prize.img || '',
                time: Date.now()
            });
        };

        window.reset = async function() {
            if(confirm("Apagar TUDO?")) {
                await remove(rParts);
                await remove(rPrizes);
                await remove(rDraw);
                localStorage.removeItem('sort_name');
                if(!isAdmin) location.reload();
            }
        };

        window.closeModal = function() {
            document.getElementById('modal-winner').classList.add('hidden');
        };

        // --- LISTENERS (Atualização em Tempo Real) ---
        onValue(rParts, snap => {
            const count = snap.exists() ? snap.size : 0;
            document.getElementById('c-parts').innerText = count;
            
            if (isAdmin) {
                const list = document.getElementById('list-parts');
                list.innerHTML = '';
                if (snap.exists()) {
                    snap.forEach(c => { list.innerHTML += `<li>${c.val().name}</li>`; });
                }
            }
        });

        onValue(rPrizes, snap => {
            const count = snap.exists() ? snap.size : 0;
            document.getElementById('c-brindes').innerText = count;
            
            if (isAdmin) {
                const list = document.getElementById('list-brindes');
                list.innerHTML = '';
                if (snap.exists()) {
                    snap.forEach(c => {
                        const p = c.val();
                        const imgHtml = p.img ? `<img src="${p.img}" class="item-img">` : '';
                        list.innerHTML += `<li><span>${p.name}</span> ${imgHtml}</li>`;
                    });
                }
            }
        });

        onValue(rDraw, snap => {
            if (snap.exists()) {
                const d = snap.val();
                if (Date.now() - d.time < 15000) { // Mostra apenas se o sorteio ocorreu há menos de 15s
                    document.getElementById('w-name').innerText = d.wName;
                    document.getElementById('w-prize').innerText = d.pName;
                    
                    const imgEl = document.getElementById('w-img');
                    if(d.img) {
                        imgEl.src = d.img;
                        imgEl.classList.remove('hidden');
                    } else {
                        imgEl.classList.add('hidden');
                    }

                    document.getElementById('modal-winner').classList.remove('hidden');
                    if(!isAdmin && navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
            }
        });
    </script>
</body>
</html>
